about: "I like problems where a model has to make a call in real time from messy
  inputs: predicting who wins a Valorant round from a broadcast feed, or
  steering a shopping cart around people at a hackathon. I also like owning the
  whole stack, which is why I run a multi-machine homelab with a Kubernetes
  cluster, my media server, databases and a chatbot fine-tuned on my own
  messages."
about_more: Away from the keyboard I tutor primary and middle-school students,
  and I built the stream overlays for MEGA's fighting-game weeklies. I speak
  English, Mandarin, Cantonese and French.
languages: English, Mandarin, Cantonese, French
