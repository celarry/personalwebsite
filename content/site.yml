  - label: Music
    text: Tenor saxophone, on a King Super 20 (Series 3) with a Theo Wanne Lakshmi
      mouthpiece and Légère American Cut 2.5 reeds.
    more_label: The setup, part by part
    setup:
      - part: Horn
        name: King Super 20 (Series 3)
        note: The saxophone itself, a vintage King. The keys, the tube and the bell.
      - part: Mouthpiece
        name: Theo Wanne Lakshmi
        note: Where the sound starts. Its shape has a big say in how bright or dark the
          tone is.
      - part: Reed
        name: Légère American Cut, strength 2.5
        note: Vibrates against the mouthpiece. Légère reeds are synthetic, so they play
          the same every day; 2.5 is how stiff it is.
