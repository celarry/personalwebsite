# Cloudflare settings for the recorder tick. Deploy with `npx wrangler deploy` from this folder,
# or connect the repository in the Cloudflare dashboard with worker/tick as the root directory.
name = "lawrenceqi-recorder-tick"
main = "index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
